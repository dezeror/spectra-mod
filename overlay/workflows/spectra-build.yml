name: Spectra Build

# One-click build of the Spectra mod APK:
#   1) clone pinned Nagram with submodules (native libs build via Gradle CMake)
#   2) apply the Spectra overlay (branding, icons, config, theme, settings UI)
#   3) assemble installable APK (debug key) and an unsigned release APK
#   4) optionally sign the release APK if repo secrets are configured:
#        ANDROID_KEYSTORE_B64 (base64 .jks), ANDROID_KEYSTORE_PASS,
#        ANDROID_KEY_ALIAS, ANDROID_KEY_PASS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ 'spectra-mod/**', '.github/workflows/spectra-build.yml' ]

concurrency:
  group: spectra-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Spectra overlay
        uses: actions/checkout@v4

      - name: Clone Nagram (shallow, with submodules)
        run: |
          git clone --depth 1 --recurse-submodules -j8 https://github.com/NextAlone/Nagram.git nagram
          echo "NAGRAM_COMMIT=$(git -C nagram rev-parse HEAD)" >> $GITHUB_ENV

      - name: Apply Spectra overlay
        run: |
          python3 spectra-mod/overlay/tools/apply_overlay.py --repo "$GITHUB_WORKSPACE/nagram"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APKs
        working-directory: nagram
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
        run: |
          set -o pipefail
          ( ./gradlew --no-daemon TMessagesProj:assembleArm64Debug \
            || ./gradlew --no-daemon TMessagesProj:assembleDebug \
            || ./gradlew --no-daemon TMessagesProj:assembleArm64Release \
            || ./gradlew --no-daemon TMessagesProj:assembleRelease \
          ) 2>&1 | tee build.log

      - name: Sign release APK (if secrets provided)
        if: env.ANDROID_KEYSTORE_B64 != ''
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > spectra.jks
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          [ -d "$BUILD_TOOLS" ] || BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find nagram/TMessagesProj/build/outputs/apk -name "*arm64*release*.apk" -o -name "*release*.apk" | grep -v unsigned | head -1)
          [ -z "$APK" ] && APK=$(find nagram/TMessagesProj/build/outputs/apk -name "*.apk" | grep release | head -1)
          if [ -n "$APK" ]; then
            "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" aligned.apk
            "$BUILD_TOOLS/apksigner" sign --ks spectra.jks \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass pass:"$ANDROID_KEYSTORE_PASS" \
              --key-pass pass:"$ANDROID_KEY_PASS" \
              --out Spectra-release-signed.apk aligned.apk
            echo "SIGNED_APK=Spectra-release-signed.apk" >> $GITHUB_ENV
          else
            echo "No release APK found to sign" && true
          fi

      - name: Collect artifacts
        run: |
          mkdir -p out
          find nagram/TMessagesProj/build/outputs/apk -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          [ -f Spectra-release-signed.apk ] && cp Spectra-release-signed.apk out/ || true
          ls -la out/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spectra-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Spectra-build-log
          path: nagram/build.log
          if-no-files-found: ignore
